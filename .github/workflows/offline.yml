name: Build offline file
on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'days/**', 'tools/build_offline.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_offline.py AI-Study-Offline.html
      - name: Publish to the "offline" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 -c "import json;print(sum(d['r'] for d in json.load(open('manifest.json'))['days']))")
          gh release view offline >/dev/null 2>&1 || gh release create offline --title "Offline version" --notes "نسخة أوفلاين: نزّل الملف وافتحه بالمتصفح."
          gh release edit offline --notes "نسخة أوفلاين فيها $N يوم جاهز من 515. نزّل AI-Study-Offline.html وافتحه بـ Chrome أو Edge أو Firefox من غير نت."
          gh release upload offline AI-Study-Offline.html --clobber
